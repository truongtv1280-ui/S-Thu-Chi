<script>
    const firebaseConfig = {
        apiKey: "AIzaSyD60xItsgAdFomunCdhypi26yyI5xrp0P0",
        authDomain: "appthuchimoi.firebaseapp.com",
        databaseURL: "https://appthuchimoi-default-rtdb.firebaseio.com",
        projectId: "appthuchimoi",
        storageBucket: "appthuchimoi.firebasestorage.app",
        messagingSenderId: "77316598744",
        appId: "1:77316598744:web:e0da4f203841cdfcee60ad",
        measurementId: "G-LDYPBV32N6"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.database();

    // Thiết lập lưu trữ thông tin đăng nhập vào Bộ nhớ cục bộ (Tránh đơ khi redirect trên Safari)
    auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);

    let chartInstance = null;

    function app() {
        return {
            user: null,
            activeTab: 'home',
            authTab: 'google',
            emailInput: '',
            passwordInput: '',
            isLoggingIn: false,
            hideBalance: false,
            timeFilter: 'month',
            accounts: [],
            transactions: [],
            filteredIncome: 0,
            filteredExpense: 0,
            filteredCategoryPercentages: [],
            showAccModal: false,
            showTxModal: false,
            newAcc: { name: '', balance: 0 },
            newTx: { type: 'expense', category: 'Ăn uống', accountId: '', targetAccountId: '', amount: '', note: '' },

            expenseCategories: [
                { name: 'Ăn uống', icon: '🍜' },
                { name: 'Đi lại', icon: '⛽' },
                { name: 'Cafe/Trà sữa', icon: '☕' },
                { name: 'Mua sắm', icon: '🛒' },
                { name: 'Dịch vụ gia đình', icon: '🏠' },
                { name: 'Giải trí', icon: '🎬' },
                { name: 'Sức khỏe', icon: '💊' },
                { name: 'Chi khác', icon: '❓' }
            ],
            incomeCategories: [
                { name: 'Lương', icon: '💵' },
                { name: 'Thưởng', icon: '🎁' },
                { name: 'Bán hàng', icon: '🛍️' },
                { name: 'Thu khác', icon: '💰' }
            ],

            get currentCategories() {
                return this.newTx.type === 'expense' ? this.expenseCategories : this.incomeCategories;
            },

            onTxTypeChange() {
                if (this.newTx.type === 'expense') this.newTx.category = 'Ăn uống';
                else if (this.newTx.type === 'income') this.newTx.category = 'Lương';
            },

            getTxTitle(tx) {
                if (tx.type === 'expense' || tx.type === 'income') return tx.category || 'Giao dịch';
                if (tx.type === 'lend') return 'Cho vay';
                if (tx.type === 'borrow') return 'Đi vay';
                if (tx.type === 'transfer') return 'Chuyển khoản';
                if (tx.type === 'adjust') return 'Điều chỉnh số dư';
                return 'Giao dịch';
            },

            getTxIcon(tx) {
                if (tx.type === 'expense' || tx.type === 'income') {
                    const allCats = [...this.expenseCategories, ...this.incomeCategories];
                    const found = allCats.find(c => c.name === tx.category);
                    return found ? found.icon : '📝';
                }
                if (tx.type === 'lend') return '💸';
                if (tx.type === 'borrow') return '💰';
                if (tx.type === 'transfer') return '🔄';
                if (tx.type === 'adjust') return '📝';
                return '📝';
            },

            getTxTypeBg(type) {
                if (type === 'income' || type === 'borrow') return 'bg-emerald-50 text-emerald-600';
                if (type === 'expense' || type === 'lend') return 'bg-red-50 text-red-500';
                return 'bg-blue-50 text-blue-600';
            },

            getTxColorClass(type) {
                if (type === 'income' || type === 'borrow') return 'text-emerald-600';
                if (type === 'expense' || type === 'lend') return 'text-red-500';
                return 'text-gray-700';
            },

            getTxPrefix(type) {
                if (type === 'income' || type === 'borrow') return '+';
                if (type === 'expense' || type === 'lend') return '-';
                return '';
            },

            getBarHeight(type) {
                const max = Math.max(this.filteredIncome, this.filteredExpense);
                if (max === 0) return 10;
                const val = type === 'income' ? this.filteredIncome : this.filteredExpense;
                return Math.max(10, Math.round((val / max) * 100));
            },

            init() {
                this.isLoggingIn = false;

                // Xử lý lấy thông tin sau khi chọn Gmail đăng nhập thành công
                auth.getRedirectResult()
                    .then((result) => {
                        this.isLoggingIn = false;
                        if (result.user) {
                            this.user = result.user;
                            this.loadData();
                        }
                    })
                    .catch((error) => {
                        this.isLoggingIn = false;
                        if (error.code && error.code !== 'auth/cancelled-popup-request') {
                            console.error("Lỗi Đăng Nhập:", error);
                        }
                    });

                // Lắng nghe thay đổi trạng thái Auth
                auth.onAuthStateChanged(u => {
                    this.user = u;
                    this.isLoggingIn = false;
                    if (u) {
                        this.loadData();
                    } else {
                        this.accounts = [];
                        this.transactions = [];
                    }
                });

                this.$watch('activeTab', (val) => {
                    if (val === 'home') {
                        this.$nextTick(() => this.updateOverviewChart());
                    }
                });
            },

            loginWithGoogle() {
                if (this.isLoggingIn) return;
                this.isLoggingIn = true;

                const provider = new firebase.auth.GoogleAuthProvider();
                provider.setCustomParameters({
                    prompt: 'select_account'
                });

                // Dùng Redirect cho di động và nhận kết quả ở hàm init()
                auth.signInWithRedirect(provider);
            },

            loginWithEmail() {
                if (!this.emailInput || !this.passwordInput) return alert("Vui lòng nhập đầy đủ Email và Mật khẩu!");
                auth.signInWithEmailAndPassword(this.emailInput, this.passwordInput)
                    .catch(err => alert("Lỗi đăng nhập: " + err.message));
            },

            registerWithEmail() {
                if (!this.emailInput || !this.passwordInput) return alert("Vui lòng nhập đầy đủ Email và Mật khẩu!");
                if (this.passwordInput.length < 6) return alert("Mật khẩu phải từ 6 ký tự trở lên!");
                auth.createUserWithEmailAndPassword(this.emailInput, this.passwordInput)
                    .then(() => alert("Đăng ký thành công!"))
                    .catch(err => alert("Lỗi đăng ký: " + err.message));
            },

            logout() {
                auth.signOut().then(() => {
                    this.user = null;
                    this.isLoggingIn = false;
                });
            },

            loadData() {
                if (!this.user) return;
                db.ref('users/' + this.user.uid).on('value', snapshot => {
                    const data = snapshot.val();
                    if (data) {
                        this.accounts = data.accounts ? Object.values(data.accounts) : [];
                        this.transactions = data.transactions ? Object.values(data.transactions) : [];
                    } else {
                        this.accounts = [];
                        this.transactions = [];
                    }
                    this.updateOverviewChart();
                });
            },

            calculateTotalBalance() {
                return this.accounts.reduce((sum, acc) => sum + Number(acc.balance || 0), 0);
            },

            calculateTotalIncome() {
                return this.transactions.filter(t => t.type === 'income').reduce((sum, t) => sum + Number(t.amount || 0), 0);
            },

            calculateTotalExpense() {
                return this.transactions.filter(t => t.type === 'expense').reduce((sum, t) => sum + Number(t.amount || 0), 0);
            },

            filterTransactionsByTime() {
                const now = new Date();
                return this.transactions.filter(t => {
                    const d = new Date(t.date);
                    if (this.timeFilter === 'today') {
                        return d.toDateString() === now.toDateString();
                    } else if (this.timeFilter === 'week') {
                        const firstDayOfWeek = new Date(now.setDate(now.getDate() - now.getDay()));
                        return d >= firstDayOfWeek;
                    } else if (this.timeFilter === 'month') {
                        return d.getMonth() === new Date().getMonth() && d.getFullYear() === new Date().getFullYear();
                    } else if (this.timeFilter === 'quarter') {
                        const currentQuarter = Math.floor(new Date().getMonth() / 3);
                        const txQuarter = Math.floor(d.getMonth() / 3);
                        return currentQuarter === txQuarter && d.getFullYear() === new Date().getFullYear();
                    } else if (this.timeFilter === 'year') {
                        return d.getFullYear() === new Date().getFullYear();
                    }
                    return true;
                });
            },

            updateOverviewChart() {
                const filtered = this.filterTransactionsByTime();
                
                this.filteredIncome = filtered.filter(t => t.type === 'income').reduce((s, t) => s + Number(t.amount || 0), 0);
                this.filteredExpense = filtered.filter(t => t.type === 'expense').reduce((s, t) => s + Number(t.amount || 0), 0);

                const catMap = {};
                const expenses = filtered.filter(t => t.type === 'expense');
                expenses.forEach(t => {
                    const cat = t.category || 'Chi khác';
                    catMap[cat] = (catMap[cat] || 0) + Number(t.amount || 0);
                });

                const colors = ['#f59e0b', '#f43f5e', '#10b981', '#3b82f6', '#8b5cf6', '#ec4899', '#6366f1'];
                let colorIdx = 0;

                this.filteredCategoryPercentages = Object.keys(catMap).map(cat => {
                    const amount = catMap[cat];
                    const percentage = this.filteredExpense > 0 ? ((amount / this.filteredExpense) * 100).toFixed(2) : 0;
                    const color = colors[colorIdx % colors.length];
                    colorIdx++;
                    return { category: cat, amount, percentage, color };
                }).sort((a,b) => b.amount - a.amount);

                this.$nextTick(() => {
                    const ctx = document.getElementById('categoryDoughnutChart');
                    if (!ctx) return;

                    if (chartInstance) chartInstance.destroy();

                    const labels = this.filteredCategoryPercentages.map(c => c.category);
                    const data = this.filteredCategoryPercentages.map(c => c.amount);
                    const bgColors = this.filteredCategoryPercentages.map(c => c.color);

                    chartInstance = new Chart(ctx, {
                        type: 'doughnut',
                        data: {
                            labels: labels.length > 0 ? labels : ['Chưa có dữ liệu'],
                            datasets: [{
                                data: data.length > 0 ? data : [1],
                                backgroundColor: bgColors.length > 0 ? bgColors : ['#e5e7eb'],
                                borderWidth: 2,
                                borderColor: '#ffffff'
                            }]
                        },
                        options: {
                            cutout: '70%',
                            plugins: {
                                legend: { display: false },
                                tooltip: { enabled: labels.length > 0 }
                            },
                            responsive: true,
                            maintainAspectRatio: false
                        }
                    });
                });
            },

            openAccountModal() {
                this.newAcc = { name: '', balance: '' };
                this.showAccModal = true;
            },

            addAccount() {
                if (!this.newAcc.name) return alert("Vui lòng nhập tên ví!");
                const id = db.ref().child('users').push().key;
                const accountData = {
                    id: id,
                    name: this.newAcc.name,
                    balance: Number(this.newAcc.balance) || 0
                };
                db.ref(`users/${this.user.uid}/accounts/${id}`).set(accountData);
                this.showAccModal = false;
            },

            deleteAccount(id) {
                if (confirm("Bạn có chắc chắn muốn xóa ví này?")) {
                    db.ref(`users/${this.user.uid}/accounts/${id}`).remove();
                }
            },

            openTxModal() {
                if (this.accounts.length === 0) return alert("Bạn cần tạo ít nhất 1 ví tài khoản trước!");
                const defaultTarget = this.accounts.length > 1 ? this.accounts[1].id : this.accounts[0].id;
                this.newTx = { 
                    type: 'expense', 
                    category: 'Ăn uống', 
                    accountId: this.accounts[0].id, 
                    targetAccountId: defaultTarget,
                    amount: '', 
                    note: '' 
                };
                this.showTxModal = true;
            },

            addTransaction() {
                if (!this.newTx.amount && this.newTx.type !== 'adjust') return alert("Vui lòng nhập số tiền hợp lệ!");
                
                const id = db.ref().child('users').push().key;
                const amount = Number(this.newTx.amount) || 0;
                const targetAcc = this.accounts.find(a => a.id === this.newTx.accountId);

                if (!targetAcc) return alert("Vui lòng chọn tài khoản!");

                if (this.newTx.type === 'expense' || this.newTx.type === 'lend') {
                    db.ref(`users/${this.user.uid}/accounts/${targetAcc.id}/balance`).set(Number(targetAcc.balance) - amount);
                } else if (this.newTx.type === 'income' || this.newTx.type === 'borrow') {
                    db.ref(`users/${this.user.uid}/accounts/${targetAcc.id}/balance`).set(Number(targetAcc.balance) + amount);
                } else if (this.newTx.type === 'transfer') {
                    if (this.newTx.accountId === this.newTx.targetAccountId) return alert("Ví đích phải khác ví nguồn!");
                    const targetAcc2 = this.accounts.find(a => a.id === this.newTx.targetAccountId);
                    if (!targetAcc2) return alert("Vui lòng chọn ví nhận!");

                    db.ref(`users/${this.user.uid}/accounts/${targetAcc.id}/balance`).set(Number(targetAcc.balance) - amount);
                    db.ref(`users/${this.user.uid}/accounts/${targetAcc2.id}/balance`).set(Number(targetAcc2.balance) + amount);
                } else if (this.newTx.type === 'adjust') {
                    db.ref(`users/${this.user.uid}/accounts/${targetAcc.id}/balance`).set(amount);
                }

                const txData = {
                    id: id,
                    type: this.newTx.type,
                    category: (this.newTx.type === 'expense' || this.newTx.type === 'income') ? this.newTx.category : '',
                    accountId: this.newTx.accountId,
                    targetAccountId: this.newTx.type === 'transfer' ? this.newTx.targetAccountId : '',
                    amount: amount,
                    note: this.newTx.note,
                    date: new Date().toISOString()
                };

                db.ref(`users/${this.user.uid}/transactions/${id}`).set(txData);
                this.showTxModal = false;
            },

            deleteTransaction(id) {
                if (confirm("Xóa giao dịch này?")) {
                    db.ref(`users/${this.user.uid}/transactions/${id}`).remove();
                }
            },

            get sortedTransactions() {
                return [...this.transactions].sort((a, b) => new Date(b.date) - new Date(a.date));
            },

            getAccountName(accId) {
                const acc = this.accounts.find(a => a.id === accId);
                return acc ? acc.name : 'Ví không xác định';
            },

            formatMoney(amount) {
                return new Intl.NumberFormat('vi-VN', { style: 'currency', currency: 'VND' }).format(amount || 0);
            },

            formatDate(dateStr) {
                if (!dateStr) return '';
                const d = new Date(dateStr);
                return `${d.getDate()}/${d.getMonth()+1}/${d.getFullYear()}`;
            }
        }
    }
</script>
