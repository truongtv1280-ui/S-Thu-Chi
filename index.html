<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sổ Thu Chi Cá Nhân</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
</head>
<body class="bg-gray-100 min-h-screen text-gray-800 pb-24" x-data="app()">

    <!-- Header -->
    <header class="bg-sky-600 text-white p-4 shadow-md sticky top-0 z-30">
        <div class="max-w-md mx-auto flex items-center justify-between">
            <h1 class="text-xl font-bold flex items-center gap-2">
                <i class="fa-solid fa-wallet"></i> Sổ Thu Chi
            </h1>
            <template x-if="user">
                <div class="flex items-center gap-2">
                    <img :src="user.photoURL" class="w-8 h-8 rounded-full border-2 border-white" title="Avatar">
                    <button @click="logout()" class="text-xs bg-sky-700 hover:bg-sky-800 px-2 py-1 rounded text-white" title="Đăng xuất">
                        <i class="fa-solid fa-right-from-bracket"></i>
                    </button>
                </div>
            </template>
        </div>
    </header>

    <main class="max-w-md mx-auto p-4 space-y-4">

        <!-- MÀN HÌNH CHƯA ĐĂNG NHẬP -->
        <template x-if="!user">
            <div class="bg-white p-6 rounded-2xl shadow-sm text-center space-y-4 mt-8">
                <div class="w-16 h-16 bg-sky-100 text-sky-600 rounded-full flex items-center justify-center mx-auto text-2xl">
                    <i class="fa-solid fa-shield-halved"></i>
                </div>
                <h2 class="text-lg font-bold text-gray-800">Đăng nhập bằng Google</h2>
                <p class="text-sm text-gray-500">Dữ liệu thu chi của bạn được bảo mật tuyệt đối và tự động đồng bộ riêng biệt theo tài khoản Google.</p>
                <button @click="loginWithGoogle()" class="w-full bg-white border border-gray-300 text-gray-700 font-semibold py-3 px-4 rounded-xl shadow-sm hover:bg-gray-50 flex items-center justify-center gap-3 transition">
                    <img src="https://www.svgrepo.com/show/475656/google-color.svg" class="w-5 h-5" alt="Google">
                    <span>Đăng nhập với Google</span>
                </button>
            </div>
        </template>

        <!-- MÀN HÌNH ĐÃ ĐĂNG NHẬP -->
        <template x-if="user">
            <div class="space-y-4">

                <!-- TỔNG SỐ DƯ -->
                <div class="bg-gradient-to-br from-sky-500 to-sky-700 text-white p-5 rounded-2xl shadow-lg relative overflow-hidden">
                    <div class="absolute -right-4 -bottom-4 text-white/10 text-8xl">
                        <i class="fa-solid fa-coins"></i>
                    </div>
                    <div class="relative z-10">
                        <p class="text-xs text-sky-100 font-medium uppercase tracking-wider mb-1">Tổng Số Dư Hiện Có</p>
                        <h2 class="text-3xl font-extrabold" x-text="formatMoney(calculateTotalBalance())">0 ₫</h2>
                        <div class="mt-4 pt-3 border-t border-sky-400/40 flex justify-between text-xs text-sky-100">
                            <span>Tài khoản ví: <strong x-text="accounts.length">0</strong></span>
                            <span class="truncate max-w-[200px]" x-text="user.email"></span>
                        </div>
                    </div>
                </div>

                <!-- DANH SÁCH TÀI KHOẢN VÍ -->
                <div class="bg-white p-4 rounded-2xl shadow-sm space-y-3">
                    <div class="flex justify-between items-center">
                        <h3 class="font-bold text-gray-700 flex items-center gap-2 text-sm">
                            <i class="fa-solid fa-building-columns text-sky-600"></i> Danh Sách Ví / Tài Khoản
                        </h3>
                        <button @click="openAccountModal()" class="text-xs bg-sky-50 text-sky-600 hover:bg-sky-100 font-semibold px-3 py-1.5 rounded-lg transition">
                            + Thêm ví
                        </button>
                    </div>

                    <div class="divide-y divide-gray-100">
                        <template x-for="acc in accounts" :key="acc.id">
                            <div class="py-2.5 flex justify-between items-center">
                                <div>
                                    <p class="font-semibold text-gray-800 text-sm" x-text="acc.name"></p>
                                    <p class="text-xs text-gray-400" x-text="acc.type || 'Ví tiền'"></p>
                                </div>
                                <div class="flex items-center gap-2">
                                    <span class="font-bold text-sm" :class="acc.balance >= 0 ? 'text-gray-800' : 'text-red-500'" x-text="formatMoney(acc.balance)"></span>
                                    <button @click="deleteAccount(acc.id)" class="text-gray-300 hover:text-red-500 text-xs p-1">
                                        <i class="fa-solid fa-trash"></i>
                                    </button>
                                </div>
                            </div>
                        </template>
                        <template x-if="accounts.length === 0">
                            <p class="text-xs text-gray-400 text-center py-4">Chưa có tài khoản nào. Nhấn "+ Thêm ví" để bắt đầu.</p>
                        </template>
                    </div>
                </div>

                <!-- LỊCH SỬ GIAO DỊCH -->
                <div class="bg-white p-4 rounded-2xl shadow-sm space-y-3">
                    <div class="flex justify-between items-center">
                        <h3 class="font-bold text-gray-700 flex items-center gap-2 text-sm">
                            <i class="fa-solid fa-list-check text-sky-600"></i> Giao Dịch Gần Đây
                        </h3>
                        <button @click="openTxModal()" class="text-xs bg-emerald-50 text-emerald-600 hover:bg-emerald-100 font-semibold px-3 py-1.5 rounded-lg transition">
                            + Thêm thu/chi
                        </button>
                    </div>

                    <div class="divide-y divide-gray-100">
                        <template x-for="tx in sortedTransactions" :key="tx.id">
                            <div class="py-2.5 flex justify-between items-center">
                                <div class="space-y-0.5">
                                    <p class="font-semibold text-gray-800 text-sm" x-text="tx.note || getTypeName(tx.type)"></p>
                                    <p class="text-[11px] text-gray-400" x-text="formatDate(tx.date) + ' • ' + getAccountName(tx.accountId)"></p>
                                </div>
                                <div class="flex items-center gap-2">
                                    <span class="font-bold text-sm" :class="tx.type === 'income' ? 'text-emerald-600' : 'text-red-500'"
                                          x-text="(tx.type === 'income' ? '+' : '-') + formatMoney(tx.amount)"></span>
                                    <button @click="deleteTransaction(tx.id)" class="text-gray-300 hover:text-red-500 text-xs p-1">
                                        <i class="fa-solid fa-xmark"></i>
                                    </button>
                                </div>
                            </div>
                        </template>
                        <template x-if="transactions.length === 0">
                            <p class="text-xs text-gray-400 text-center py-4">Chưa có giao dịch nào.</p>
                        </template>
                    </div>
                </div>

            </div>
        </template>

    </main>

    <!-- MODAL THÊM TÀI KHOẢN -->
    <div x-show="showAccModal" class="fixed inset-0 bg-black/50 z-50 flex items-end justify-center p-4" x-cloak>
        <div class="bg-white w-full max-w-md rounded-2xl p-5 space-y-4">
            <h3 class="font-bold text-gray-800">Thêm Ví / Tài Khoản Mới</h3>
            <input type="text" x-model="newAcc.name" placeholder="Tên ví (Ví dụ: Tiền mặt, ATM Vietcombank)" class="w-full border rounded-xl p-3 text-sm focus:outline-none focus:border-sky-500">
            <input type="number" x-model.number="newAcc.balance" placeholder="Số dư ban đầu" class="w-full border rounded-xl p-3 text-sm focus:outline-none focus:border-sky-500">
            <div class="flex gap-2">
                <button @click="showAccModal = false" class="w-1/2 py-2.5 bg-gray-100 rounded-xl text-sm font-semibold text-gray-600">Hủy</button>
                <button @click="addAccount()" class="w-1/2 py-2.5 bg-sky-600 rounded-xl text-sm font-semibold text-white">Lưu</button>
            </div>
        </div>
    </div>

    <!-- MODAL THÊM GIAO DỊCH -->
    <div x-show="showTxModal" class="fixed inset-0 bg-black/50 z-50 flex items-end justify-center p-4" x-cloak>
        <div class="bg-white w-full max-w-md rounded-2xl p-5 space-y-4">
            <h3 class="font-bold text-gray-800">Thêm Giao Dịch</h3>
            
            <div class="grid grid-cols-2 gap-2">
                <button @click="newTx.type = 'expense'" :class="newTx.type === 'expense' ? 'bg-red-500 text-white' : 'bg-gray-100 text-gray-700'" class="py-2 rounded-xl font-semibold text-sm">Chi tiền (-)</button>
                <button @click="newTx.type = 'income'" :class="newTx.type === 'income' ? 'bg-emerald-500 text-white' : 'bg-gray-100 text-gray-700'" class="py-2 rounded-xl font-semibold text-sm">Thu tiền (+)</button>
            </div>

            <div>
                <label class="text-xs text-gray-500 font-medium mb-1 block">Tài khoản ví</label>
                <select x-model="newTx.accountId" class="w-full border rounded-xl p-3 text-sm focus:outline-none focus:border-sky-500">
                    <template x-for="acc in accounts" :key="acc.id">
                        <option :value="acc.id" x-text="acc.name"></option>
                    </template>
                </select>
            </div>

            <input type="number" x-model.number="newTx.amount" placeholder="Số tiền" class="w-full border rounded-xl p-3 text-sm focus:outline-none focus:border-sky-500">
            <input type="text" x-model="newTx.note" placeholder="Ghi chú (Ví dụ: Ăn sáng, Lương tháng)" class="w-full border rounded-xl p-3 text-sm focus:outline-none focus:border-sky-500">

            <div class="flex gap-2">
                <button @click="showTxModal = false" class="w-1/2 py-2.5 bg-gray-100 rounded-xl text-sm font-semibold text-gray-600">Hủy</button>
                <button @click="addTransaction()" class="w-1/2 py-2.5 bg-sky-600 rounded-xl text-sm font-semibold text-white">Lưu Giao Dịch</button>
            </div>
        </div>
    </div>

    <!-- LOGIC JAVASCRIPT -->
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyC7Kccxqj9HOfn2Pb01nJAwuoHE2Y86oPs",
            authDomain: "appthuchi-ebea8.firebaseapp.com",
            databaseURL: "https://appthuchi-ebea8-default-rtdb.firebaseio.com",
            projectId: "appthuchi-ebea8",
            storageBucket: "appthuchi-ebea8.firebasestorage.app",
            messagingSenderId: "1003569565581",
            appId: "1:1003569565581:web:b73287937ce0dd6934b7c4",
            measurementId: "G-YSMN9PH1JP"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.database();

        function app() {
            return {
                user: null,
                accounts: [],
                transactions: [],
                showAccModal: false,
                showTxModal: false,
                newAcc: { name: '', balance: 0 },
                newTx: { type: 'expense', accountId: '', amount: 0, note: '' },

                init() {
                    auth.onAuthStateChanged(u => {
                        this.user = u;
                        if (u) {
                            this.loadData();
                        } else {
                            this.accounts = [];
                            this.transactions = [];
                        }
                    });
                },

                loginWithGoogle() {
                    const provider = new firebase.auth.GoogleAuthProvider();
                    auth.signInWithPopup(provider).catch(err => alert("Đăng nhập lỗi: " + err.message));
                },

                logout() {
                    auth.signOut();
                },

                loadData() {
                    if (!this.user) return;
                    db.ref('users/' + this.user.uid).on('value', snapshot => {
                        const data = snapshot.val();
                        if (data) {
                            this.accounts = data.accounts ? Object.values(data.accounts) : [];
                            this.transactions = data.transactions ? Object.values(data.transactions) : [];
                        } else {
                            this.accounts = [];
                            this.transactions = [];
                        }
                    });
                },

                calculateTotalBalance() {
                    return this.accounts.reduce((sum, acc) => sum + Number(acc.balance || 0), 0);
                },

                openAccountModal() {
                    this.newAcc = { name: '', balance: '' };
                    this.showAccModal = true;
                },

                addAccount() {
                    if (!this.newAcc.name) return alert("Vui lòng nhập tên ví!");
                    const id = db.ref().child('users').push().key;
                    const accountData = {
                        id: id,
                        name: this.newAcc.name,
                        balance: Number(this.newAcc.balance) || 0
                    };
                    db.ref(`users/${this.user.uid}/accounts/${id}`).set(accountData);
                    this.showAccModal = false;
                },

                deleteAccount(id) {
                    if (confirm("Bạn có chắc chắn muốn xóa ví này?")) {
                        db.ref(`users/${this.user.uid}/accounts/${id}`).remove();
                    }
                },

                openTxModal() {
                    if (this.accounts.length === 0) return alert("Bạn cần tạo ít nhất 1 ví tài khoản trước!");
                    this.newTx = { type: 'expense', accountId: this.accounts[0].id, amount: '', note: '' };
                    this.showTxModal = true;
                },

                addTransaction() {
                    if (!this.newTx.amount || this.newTx.amount <= 0) return alert("Vui lòng nhập số tiền hợp lệ!");
                    
                    const id = db.ref().child('users').push().key;
                    const amount = Number(this.newTx.amount);
                    const txData = {
                        id: id,
                        type: this.newTx.type,
                        accountId: this.newTx.accountId,
                        amount: amount,
                        note: this.newTx.note,
                        date: new Date().toISOString()
                    };

                    // Cập nhật số dư ví
                    const targetAcc = this.accounts.find(a => a.id === this.newTx.accountId);
                    if (targetAcc) {
                        const newBalance = this.newTx.type === 'income' 
                            ? Number(targetAcc.balance) + amount 
                            : Number(targetAcc.balance) - amount;
                        
                        db.ref(`users/${this.user.uid}/accounts/${targetAcc.id}/balance`).set(newBalance);
                    }

                    // Lưu giao dịch
                    db.ref(`users/${this.user.uid}/transactions/${id}`).set(txData);
                    this.showTxModal = false;
                },

                deleteTransaction(id) {
                    if (confirm("Xóa giao dịch này?")) {
                        db.ref(`users/${this.user.uid}/transactions/${id}`).remove();
                    }
                },

                get sortedTransactions() {
                    return [...this.transactions].sort((a, b) => new Date(b.date) - new Date(a.date));
                },

                getAccountName(accId) {
                    const acc = this.accounts.find(a => a.id === accId);
                    return acc ? acc.name : 'Ví không xác định';
                },

                getTypeName(type) {
                    return type === 'income' ? 'Thu nhập' : 'Chi tiêu';
                },

                formatMoney(amount) {
                    return new Intl.NumberFormat('vi-VN', { style: 'currency', currency: 'VND' }).format(amount || 0);
                },

                formatDate(dateStr) {
                    if (!dateStr) return '';
                    const d = new Date(dateStr);
                    return `${d.getDate()}/${d.getMonth()+1}/${d.getFullYear()}`;
                }
            }
        }
    </script>
</body>
</html>
