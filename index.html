<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quản Lý Thu Chi</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">

  <div class="bg-white rounded-2xl shadow-xl w-full max-w-md p-6 space-y-6">
    <!-- Màn hình Đăng nhập -->
    <div id="login-screen" class="text-center space-y-4">
      <h1 class="text-2xl font-bold text-gray-800">Quản Lý Thu Chi</h1>
      <p class="text-gray-500 text-sm">Theo dõi tài chính cá nhân dễ dàng</p>
      <button id="btn-login" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-4 rounded-xl shadow-md transition duration-200 flex items-center justify-center space-x-2">
        <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24">
          <path d="M12.24 10.285V13.4h6.887C18.2 15.683 15.65 18 12.24 18c-3.315 0-6-2.685-6-6s2.685-6 6-6c1.47 0 2.81.53 3.845 1.41l2.58-2.58C17.07 3.32 14.8 2.4 12.24 2.4 6.97 2.4 2.7 6.67 2.7 11.94s4.27 9.54 9.54 9.54c5.51 0 9.18-3.87 9.18-9.35 0-.64-.06-1.25-.18-1.845H12.24z"/>
        </svg>
        <span>Đăng nhập với Google</span>
      </button>
    </div>

    <!-- Màn hình Ứng dụng chính -->
    <div id="app-screen" class="hidden space-y-6">
      <!-- Thông tin User -->
      <div class="flex items-center justify-between border-b pb-4">
        <div class="flex items-center space-x-3">
          <img id="user-avatar" class="w-10 h-10 rounded-full border" src="" alt="Avatar">
          <span id="user-name" class="font-semibold text-gray-700"></span>
        </div>
        <button id="btn-logout" class="text-xs text-red-500 hover:underline">Đăng xuất</button>
      </div>

      <!-- Số dư -->
      <div class="bg-blue-50 p-4 rounded-xl text-center">
        <p class="text-xs font-semibold text-gray-500 uppercase">Số dư hiện tại</p>
        <p id="balance" class="text-2xl font-bold text-blue-600 my-1">0 đ</p>
        <button id="btn-reset" class="text-xs text-gray-400 hover:text-gray-600 underline">Reset ví về 0 đ</button>
      </div>

      <!-- Form nhập -->
      <form id="tx-form" class="space-y-3">
        <input id="tx-desc" type="text" placeholder="Nội dung (ví dụ: Lương, Ăn sáng)" required class="w-full px-3 py-2 border rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
        <input id="tx-amount" type="number" placeholder="Số tiền" required min="1" class="w-full px-3 py-2 border rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
        <div class="flex space-x-2">
          <select id="tx-type" class="w-1/2 px-3 py-2 border rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
            <option value="income">Thu nhập (+)</option>
            <option value="expense">Chi tiêu (-)</option>
          </select>
          <button type="submit" class="w-1/2 bg-green-600 text-white font-medium py-2.5 rounded-lg text-sm hover:bg-green-700 transition">Thêm</button>
        </div>
      </form>

      <!-- Lịch sử -->
      <div>
        <h3 class="font-bold text-gray-700 mb-2 text-sm">Lịch sử gần đây</h3>
        <ul id="tx-list" class="divide-y max-h-48 overflow-y-auto mb-4 border rounded-lg bg-gray-50"></ul>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getDatabase, ref, push, onValue, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    // Cấu hình Firebase
    const firebaseConfig = {
      apiKey: "AIzaSyDwMnJtx2cxiB2vppy51as3NVvVC3IvWpw",
      authDomain: "quanlythuchi-7d202.firebaseapp.com",
      databaseURL: "https://quanlythuchi-7d202-default-rtdb.firebaseio.com",
      projectId: "quanlythuchi-7d202",
      storageBucket: "quanlythuchi-7d202.firebasestorage.app",
      messagingSenderId: "1072192237025",
      appId: "1:1072192237025:web:5ba6b82296c2684b22f6a8"
    };

    const firebaseApp = initializeApp(firebaseConfig);
    const auth = getAuth(firebaseApp);
    const db = getDatabase(firebaseApp);
    const provider = new GoogleAuthProvider();

    const loginScreen = document.getElementById('login-screen');
    const appScreen = document.getElementById('app-screen');
    const btnLogin = document.getElementById('btn-login');
    const btnLogout = document.getElementById('btn-logout');
    const userName = document.getElementById('user-name');
    const userAvatar = document.getElementById('user-avatar');
    const balanceEl = document.getElementById('balance');
    const txForm = document.getElementById('tx-form');
    const txList = document.getElementById('tx-list');
    const btnReset = document.getElementById('btn-reset');

    let currentUser = null;

    // Đăng nhập Popup (Hỗ trợ tốt trên điện thoại)
    btnLogin.addEventListener('click', () => {
      signInWithPopup(auth, provider).catch(error => {
        alert("Lỗi đăng nhập: " + error.message);
      });
    });

    btnLogout.addEventListener('click', () => signOut(auth));

    // Theo dõi trạng thái Đăng nhập
    onAuthStateChanged(auth, user => {
      if (user) {
        currentUser = user;
        userName.textContent = user.displayName;
        userAvatar.src = user.photoURL || 'https://via.placeholder.com/40';
        loginScreen.classList.add('hidden');
        appScreen.classList.remove('hidden');
        loadData(user.uid);
      } else {
        currentUser = null;
        loginScreen.classList.remove('hidden');
        appScreen.classList.add('hidden');
      }
    });

    // Thêm giao dịch
    txForm.addEventListener('submit', (e) => {
      e.preventDefault();
      if (!currentUser) return;

      const desc = document.getElementById('tx-desc').value;
      const amount = parseFloat(document.getElementById('tx-amount').value);
      const type = document.getElementById('tx-type').value;

      push(ref(db, `users/${currentUser.uid}/transactions`), {
        desc,
        amount,
        type,
        timestamp: Date.now()
      });

      txForm.reset();
    });

    // Tải dữ liệu từ Firebase
    function loadData(uid) {
      onValue(ref(db, `users/${uid}/transactions`), snapshot => {
        const data = snapshot.val();
        txList.innerHTML = '';
        let total = 0;

        if (data) {
          Object.keys(data).reverse().forEach(key => {
            const item = data[key];
            const isIncome = item.type === 'income';
            total += isIncome ? item.amount : -item.amount;

            const li = document.createElement('li');
            li.className = 'flex justify-between items-center p-3 text-sm';
            li.innerHTML = `
              <div>
                <p class="font-medium text-gray-800">${item.desc}</p>
                <p class="text-xs text-gray-400">${new Date(item.timestamp).toLocaleDateString('vi-VN')}</p>
              </div>
              <div class="flex items-center space-x-2">
                <span class="font-bold ${isIncome ? 'text-green-600' : 'text-red-600'}">
                  ${isIncome ? '+' : '-'}${item.amount.toLocaleString('vi-VN')} đ
                </span>
                <button onclick="deleteTx('${key}')" class="text-gray-400 hover:text-red-500 font-bold ml-2">✕</button>
              </div>
            `;
            txList.appendChild(li);
          });
        }
        balanceEl.textContent = `${total.toLocaleString('vi-VN')} đ`;
      });
    }

    // Xóa giao dịch
    window.deleteTx = function(key) {
      if (currentUser && confirm("Bạn có muốn xóa giao dịch này?")) {
        remove(ref(db, `users/${currentUser.uid}/transactions/${key}`));
      }
    };

    // Reset ví
    btnReset.addEventListener('click', () => {
      if (currentUser && confirm("Bạn có chắc muốn xóa tất cả giao dịch về 0 đ?")) {
        remove(ref(db, `users/${currentUser.uid}/transactions`));
      }
    });
  </script>
</body>
</html>
