<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý Thu Chi</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center font-sans">

    <div x-data="app" class="bg-white p-8 rounded-xl shadow-md w-full max-w-md text-center">
        <h1 class="text-2xl font-bold text-gray-800 mb-2">Quản Lý Thu Chi</h1>
        <p class="text-sm text-gray-500 mb-6">Theo dõi tài chính cá nhân dễ dàng</p>

        <!-- Trạng thái chưa đăng nhập -->
        <template x-if="!user">
            <button @click="loginWithGoogle" class="w-full flex items-center justify-center gap-3 bg-white border border-gray-300 text-gray-700 px-4 py-2.5 rounded-lg font-medium hover:bg-gray-50 transition shadow-sm">
                <svg class="w-5 h-5" viewBox="0 0 24 24">
                    <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                    <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                    <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                    <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
                </svg>
                Đăng nhập với Google
            </button>
        </template>

        <!-- Trạng thái đã đăng nhập -->
        <template x-if="user">
            <div class="space-y-4">
                <div class="flex items-center gap-3 text-left p-3 bg-gray-50 rounded-lg">
                    <img :src="user.photoURL" class="w-10 h-10 rounded-full" alt="Avatar">
                    <div>
                        <div class="font-semibold text-gray-800" x-text="user.displayName"></div>
                        <div class="text-xs text-gray-500" x-text="user.email"></div>
                    </div>
                </div>
                <button @click="logout" class="w-full bg-red-500 text-white px-4 py-2 rounded-lg font-medium hover:bg-red-600 transition">
                    Đăng xuất
                </button>
            </div>
        </template>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getDatabase, ref, push, onValue, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        // Tạo API Key bằng mảng để tránh bị tự động nối dấu gạch ngang dài
        const apiKeyParts = ["AIzaSyCNVhHtsp", "--", "ZWj_U-WFDFkJFXBBLR-Nvzg"];
        
        const firebaseConfig = {
            apiKey: apiKeyParts.join(""),
            authDomain: "quanlythuchi-7d202.firebaseapp.com",
            projectId: "quanlythuchi-7d202",
            storageBucket: "quanlythuchi-7d202.firebasestorage.app",
            messagingSenderId: "1072192237025",
            appId: "1:1072192237025:web:7b126514825b414822f6a0",
            databaseURL: "https://quanlythuchi-7d202-default-rtdb.firebaseio.com"
        };

        const firebaseApp = initializeApp(firebaseConfig);
        const auth = getAuth(firebaseApp);
        const provider = new GoogleAuthProvider();
        const db = getDatabase(firebaseApp);

        document.addEventListener('alpine:init', () => {
            Alpine.data('app', () => ({
                user: null,

                init() {
                    onAuthStateChanged(auth, (currentUser) => {
                        this.user = currentUser;
                    });
                },

                loginWithGoogle() {
                    signInWithPopup(auth, provider)
                        .then((result) => {
                            console.log("Đăng nhập thành công:", result.user);
                        })
                        .catch((error) => {
                            alert("Lỗi đăng nhập: " + error.message);
                            console.error("Firebase Auth Error:", error);
                        });
                },

                logout() {
                    signOut(auth).then(() => {
                        this.user = null;
                    });
                }
            }));
        });
    </script>
</body>
</html>
