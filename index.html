<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>S-Thu-Chi</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 font-sans">

<div class="max-w-md mx-auto min-h-screen bg-white shadow-lg p-4 pb-20">
  <!-- Màn hình Đăng Nhập -->
  <div id="auth-screen" class="py-10 text-center space-y-4">
    <h1 class="text-3xl font-bold text-blue-600">S-Thu-Chi</h1>
    <p class="text-gray-500 text-sm">Quản lý thu chi đơn giản</p>
    
    <button onclick="loginGoogle()" class="w-full bg-white border p-3 rounded-xl font-semibold shadow-sm flex items-center justify-center space-x-2">
      <span>Đăng nhập bằng Gmail</span>
    </button>
    <div class="text-xs text-gray-400">hoặc</div>
    <input type="email" id="email" placeholder="Email" class="w-full p-3 border rounded-xl">
    <input type="password" id="pass" placeholder="Mật khẩu" class="w-full p-3 border rounded-xl">
    <button onclick="loginEmail()" class="w-full bg-blue-600 text-white p-3 rounded-xl font-bold">Đăng nhập</button>
    <button onclick="registerEmail()" class="w-full bg-gray-200 text-gray-700 p-3 rounded-xl font-bold">Đăng ký mới</button>
  </div>

  <!-- Màn hình Chính -->
  <div id="main-app" class="hidden space-y-4">
    <!-- Top Bar -->
    <div class="flex justify-between items-center border-b pb-3">
      <div>
        <p class="text-xs text-gray-400">Tài khoản:</p>
        <p id="user-email" class="text-sm font-bold truncate max-w-[150px]"></p>
      </div>
      <div class="space-x-2">
        <button onclick="deleteAllData()" class="bg-red-500 text-white text-xs px-3 py-1.5 rounded-lg font-bold">Xóa tất cả</button>
        <button onclick="logout()" class="bg-gray-200 text-xs px-3 py-1.5 rounded-lg">Thoát</button>
      </div>
    </div>

    <!-- Ô Báo Cáo Tổng -->
    <div class="bg-blue-50 p-4 rounded-xl text-center">
      <p class="text-xs text-gray-500">Số dư hiện tại</p>
      <p id="total-balance" class="text-2xl font-bold text-blue-600">0 đ</p>
      <div class="flex justify-around mt-3 text-sm">
        <span class="text-green-600">Thu: <b id="total-in">0</b></span>
        <span class="text-red-600">Chi: <b id="total-out">0</b></span>
      </div>
    </div>

    <!-- Lọc Theo Ngày -->
    <div class="bg-gray-50 p-3 rounded-xl space-y-2">
      <p class="text-xs font-bold text-gray-600">Lọc theo khoảng thời gian:</p>
      <div class="flex space-x-2">
        <input type="date" id="from-date" onchange="render()" class="w-1/2 p-2 border rounded-lg text-xs">
        <input type="date" id="to-date" onchange="render()" class="w-1/2 p-2 border rounded-lg text-xs">
      </div>
    </div>

    <!-- Form Nhập Giao Dịch -->
    <div class="bg-gray-50 p-3 rounded-xl space-y-2">
      <div class="flex space-x-2">
        <select id="tx-type" class="p-2 border rounded-lg text-xs font-bold">
          <option value="out">Chi tiền (-)</option>
          <option value="in">Thu tiền (+)</option>
        </select>
        <input type="number" id="tx-amount" placeholder="Số tiền" class="flex-1 p-2 border rounded-lg text-sm">
      </div>
      <div class="flex space-x-2">
        <input type="text" id="tx-note" placeholder="Ghi chú (ví dụ: Cơm trưa)" class="flex-1 p-2 border rounded-lg text-xs">
        <input type="date" id="tx-date" class="p-2 border rounded-lg text-xs">
      </div>
      <button onclick="addTx()" class="w-full bg-blue-600 text-white p-2.5 rounded-lg text-sm font-bold">+ Thêm giao dịch</button>
    </div>

    <!-- Danh sách lịch sử -->
    <div>
      <p class="text-xs font-bold text-gray-600 mb-2">Danh sách thu chi:</p>
      <div id="tx-list" class="space-y-2"></div>
    </div>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut, GoogleAuthProvider, signInWithPopup } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
  import { getDatabase, ref, set, push, onValue, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyD60xItsgAdFomunCdhypiI5xrp0P0",
    authDomain: "appthuchimoi.firebaseapp.com",
    databaseURL: "https://appthuchimoi-default-rtdb.firebaseio.com",
    projectId: "appthuchimoi",
    storageBucket: "appthuchimoi.appspot.com",
    messagingSenderId: "77316598744",
    appId: "1:77316598744:web:e0da4f203841cdfee60ad"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getDatabase(app);

  let user = null;
  let items = [];

  document.getElementById('tx-date').value = new Date().toISOString().split('T')[0];

  onAuthStateChanged(auth, u => {
    user = u;
    if (user) {
      document.getElementById('auth-screen').classList.add('hidden');
      document.getElementById('main-app').classList.remove('hidden');
      document.getElementById('user-email').innerText = user.email || user.displayName;
      onValue(ref(db, `users/${user.uid}/txs`), snap => {
        const val = snap.val();
        items = val ? Object.keys(val).map(k => ({id: k, ...val[k]})) : [];
        render();
      });
    } else {
      document.getElementById('auth-screen').classList.remove('hidden');
      document.getElementById('main-app').classList.add('hidden');
    }
  });

  window.loginGoogle = () => signInWithPopup(auth, new GoogleAuthProvider());
  window.loginEmail = () => signInWithEmailAndPassword(auth, document.getElementById('email').value, document.getElementById('pass').value);
  window.registerEmail = () => createUserWithEmailAndPassword(auth, document.getElementById('email').value, document.getElementById('pass').value);
  window.logout = () => signOut(auth);

  window.addTx = () => {
    const amount = Number(document.getElementById('tx-amount').value);
    const note = document.getElementById('tx-note').value;
    const date = document.getElementById('tx-date').value;
    const type = document.getElementById('tx-type').value;

    if (!amount || !date) return alert("Vui lòng nhập đủ số tiền và ngày!");

    push(ref(db, `users/${user.uid}/txs`), { amount, note, date, type }).then(() => {
      document.getElementById('tx-amount').value = '';
      document.getElementById('tx-note').value = '';
    });
  };

  window.deleteAllData = () => {
    if (confirm("Bạn có chắc chắn muốn XÓA HẾT dữ liệu để tạo mới không?")) {
      remove(ref(db, `users/${user.uid}/txs`));
    }
  };

  window.render = () => {
    const from = document.getElementById('from-date').value;
    const to = document.getElementById('to-date').value;

    let filtered = items.filter(i => {
      if (from && i.date < from) return false;
      if (to && i.date > to) return false;
      return true;
    });

    let totalIn = 0, totalOut = 0;
    filtered.forEach(i => {
      if (i.type === 'in') totalIn += i.amount;
      else totalOut += i.amount;
    });

    document.getElementById('total-balance').innerText = (totalIn - totalOut).toLocaleString() + ' đ';
    document.getElementById('total-in').innerText = totalIn.toLocaleString() + ' đ';
    document.getElementById('total-out').innerText = totalOut.toLocaleString() + ' đ';

    const list = document.getElementById('tx-list');
    list.innerHTML = '';
    filtered.sort((a,b) => b.date.localeCompare(a.date)).forEach(i => {
      list.innerHTML += `
        <div class="flex justify-between items-center p-2 border-b text-sm">
          <div>
            <p class="font-bold">${i.note || 'Không ghi chú'}</p>
            <p class="text-xs text-gray-400">${i.date}</p>
          </div>
          <span class="font-bold ${i.type === 'in' ? 'text-green-600' : 'text-red-600'}">
            ${i.type === 'in' ? '+' : '-'}${i.amount.toLocaleString()} đ
          </span>
        </div>
      `;
    });
  };
</script>
</body>
</html>
