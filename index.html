<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sổ Thu Chi Cá Nhân</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <style>
        [x-cloak] { display: none !important; }
        .pb-safe { padding-bottom: env(safe-area-inset-bottom); }
    </style>
</head>
<body class="bg-gray-50 min-h-screen text-gray-800 pb-20 select-none" x-data="app()">

    <!-- Header -->
    <header class="bg-sky-600 text-white p-4 shadow-md sticky top-0 z-30">
        <div class="max-w-md mx-auto flex items-center justify-between">
            <h1 class="text-lg font-bold flex items-center gap-2">
                <i class="fa-solid fa-wallet"></i> 
                <span x-text="activeTab === 'home' ? 'Tổng Quan' : (activeTab === 'wallet' ? 'Quản Lý Ví / Tài Khoản' : (activeTab === 'report' ? 'Báo Cáo Thống Kê' : 'Lịch Sử Giao Dịch'))"></span>
            </h1>
            <template x-if="user">
                <div class="flex items-center gap-2">
                    <img :src="user.photoURL || 'https://ui-avatars.com/api/?name=' + encodeURIComponent(user.email || 'User')" class="w-8 h-8 rounded-full border-2 border-white object-cover">
                    <button @click="logout()" class="text-xs bg-sky-700 hover:bg-sky-800 p-2 rounded-full text-white transition" title="Đăng xuất">
                        <i class="fa-solid fa-right-from-bracket"></i>
                    </button>
                </div>
            </template>
        </div>
    </header>

    <main class="max-w-md mx-auto p-4">

        <!-- MÀN HÌNH CHƯA ĐĂNG NHẬP -->
        <template x-if="!user">
            <div class="bg-white p-6 rounded-3xl shadow-sm border border-gray-100 space-y-5 mt-6">
                <div class="text-center space-y-2">
                    <div class="w-16 h-16 bg-sky-100 text-sky-600 rounded-full flex items-center justify-center mx-auto text-3xl">
                        <i class="fa-solid fa-user-shield"></i>
                    </div>
                    <h2 class="text-xl font-bold text-gray-800">Đăng Nhập Tài Khoản</h2>
                    <p class="text-xs text-gray-500">Đồng bộ dữ liệu an toàn trên đa thiết bị</p>
                </div>

                <div class="grid grid-cols-2 gap-1 bg-gray-100 p-1 rounded-2xl text-xs font-semibold">
                    <button @click="authTab = 'google'" :class="authTab === 'google' ? 'bg-white text-sky-600 shadow-sm' : 'text-gray-500'" class="py-2.5 rounded-xl transition">
                        <i class="fa-brands fa-google mr-1"></i> Google
                    </button>
                    <button @click="authTab = 'email'" :class="authTab === 'email' ? 'bg-white text-sky-600 shadow-sm' : 'text-gray-500'" class="py-2.5 rounded-xl transition">
                        <i class="fa-solid fa-envelope mr-1"></i> Email
                    </button>
                </div>

                <div x-show="authTab === 'google'" class="space-y-3 pt-2">
                    <button @click="loginWithGoogle()" :disabled="isLoggingIn" class="w-full bg-white border border-gray-200 text-gray-700 font-semibold py-3 px-4 rounded-2xl shadow-sm hover:bg-gray-50 flex items-center justify-center gap-3 transition disabled:opacity-50">
                        <img src="https://www.svgrepo.com/show/475656/google-color.svg" class="w-5 h-5" alt="Google">
                        <span x-text="isLoggingIn ? 'Đang kết nối...' : 'Tiếp tục với Google'"></span>
                    </button>
                </div>

                <div x-show="authTab === 'email'" class="space-y-3 pt-1">
                    <div>
                        <label class="text-xs font-medium text-gray-600 block mb-1">Email</label>
                        <input type="email" x-model="emailInput" placeholder="nhapemail@gmail.com" class="w-full border rounded-xl p-3 text-sm focus:outline-none focus:border-sky-500">
                    </div>
                    <div>
                        <label class="text-xs font-medium text-gray-600 block mb-1">Mật khẩu</label>
                        <input type="password" x-model="passwordInput" placeholder="Mật khẩu (ít nhất 6 ký tự)" class="w-full border rounded-xl p-3 text-sm focus:outline-none focus:border-sky-500">
                    </div>
                    
                    <div class="grid grid-cols-2 gap-2 pt-2">
                        <button @click="loginWithEmail()" class="w-full bg-sky-600 text-white font-semibold py-3 px-3 rounded-xl text-xs hover:bg-sky-700 transition">
                            Đăng nhập
                        </button>
                        <button @click="registerWithEmail()" class="w-full bg-gray-100 border border-gray-300 text-gray-700 font-semibold py-3 px-3 rounded-xl text-xs hover:bg-gray-200 transition">
                            Tạo tài khoản
                        </button>
                    </div>
                </div>
            </div>
        </template>

        <!-- MÀN HÌNH ĐÃ ĐĂNG NHẬP -->
        <template x-if="user">
            <div>

                <!-- TAB 1: TỔNG QUAN -->
                <div x-show="activeTab === 'home'" class="space-y-4">
                    <div class="bg-gradient-to-br from-sky-500 to-sky-700 text-white p-6 rounded-3xl shadow-lg relative overflow-hidden">
                        <div class="absolute -right-6 -bottom-6 text-white/10 text-9xl">
                            <i class="fa-solid fa-wallet"></i>
                        </div>
                        <div class="relative z-10">
                            <p class="text-xs text-sky-100 font-medium uppercase tracking-wider mb-1">Tổng Số Dư</p>
                            <h2 class="text-3xl font-black" x-text="formatMoney(calculateTotalBalance())">0 ₫</h2>
                            <div class="mt-4 pt-3 border-t border-sky-400/40 flex justify-between text-xs text-sky-100">
                                <span>Ví hoạt động: <strong x-text="accounts.length">0</strong></span>
                                <span class="truncate max-w-[180px]" x-text="user.email"></span>
                            </div>
                        </div>
                    </div>

                    <div class="bg-white p-4 rounded-2xl border border-gray-100 shadow-sm space-y-3">
                        <div class="flex justify-between items-center">
                            <h3 class="font-bold text-gray-700 text-sm">Giao Dịch Gần Đây</h3>
                            <button @click="activeTab = 'tx_history'" class="text-xs text-sky-600 font-semibold hover:underline">Xem tất cả</button>
                        </div>
                        <div class="divide-y divide-gray-100">
                            <template x-for="tx in sortedTransactions.slice(0, 5)" :key="tx.id">
                                <div class="py-2.5 flex justify-between items-center">
                                    <div class="flex items-center gap-3">
                                        <div class="w-9 h-9 rounded-xl flex items-center justify-center text-sm" :class="tx.type === 'income' ? 'bg-emerald-50 text-emerald-600' : 'bg-red-50 text-red-500'">
                                            <span x-text="getCategoryIcon(tx.category)"></span>
                                        </div>
                                        <div class="space-y-0.5">
                                            <p class="font-semibold text-gray-800 text-sm" x-text="tx.category || 'Chi khác'"></p>
                                            <p class="text-[11px] text-gray-400" x-text="formatDate(tx.date) + (tx.note ? ' • ' + tx.note : '') + ' • ' + getAccountName(tx.accountId)"></p>
                                        </div>
                                    </div>
                                    <span class="font-bold text-sm" :class="tx.type === 'income' ? 'text-emerald-600' : 'text-red-500'" x-text="(tx.type === 'income' ? '+' : '-') + formatMoney(tx.amount)"></span>
                                </div>
                            </template>
                            <template x-if="transactions.length === 0">
                                <p class="text-xs text-gray-400 text-center py-4">Chưa có giao dịch nào.</p>
                            </template>
                        </div>
                    </div>
                </div>

                <!-- TAB 2: QUẢN LÝ VÍ / TÀI KHOẢN -->
                <div x-show="activeTab === 'wallet'" class="space-y-3">
                    <div class="flex justify-between items-center bg-white p-3 rounded-2xl shadow-sm border border-gray-100">
                        <span class="text-xs font-semibold text-gray-500" x-text="accounts.length + ' ví tài khoản'"></span>
                        <button @click="openAccountModal()" class="text-xs bg-sky-600 text-white hover:bg-sky-700 font-semibold px-3 py-2 rounded-xl transition flex items-center gap-1">
                            <i class="fa-solid fa-plus"></i> Thêm ví mới
                        </button>
                    </div>

                    <div class="space-y-2">
                        <template x-for="acc in accounts" :key="acc.id">
                            <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 flex justify-between items-center">
                                <div class="flex items-center gap-3">
                                    <div class="w-10 h-10 bg-sky-50 text-sky-600 rounded-xl flex items-center justify-center font-bold">
                                        <i class="fa-solid fa-credit-card"></i>
                                    </div>
                                    <div>
                                        <p class="font-bold text-gray-800 text-sm" x-text="acc.name"></p>
                                        <p class="text-xs text-gray-400">Số dư hiện tại</p>
                                    </div>
                                </div>
                                <div class="flex items-center gap-3">
                                    <span class="font-bold text-sm" :class="acc.balance >= 0 ? 'text-gray-800' : 'text-red-500'" x-text="formatMoney(acc.balance)"></span>
                                    <button @click="deleteAccount(acc.id)" class="text-gray-300 hover:text-red-500 text-xs p-1">
                                        <i class="fa-solid fa-trash-can"></i>
                                    </button>
                                </div>
                            </div>
                        </template>
                        <template x-if="accounts.length === 0">
                            <p class="text-xs text-gray-400 text-center py-6 bg-white rounded-2xl">Chưa có tài khoản ví. Nhấn "+ Thêm ví mới" để tạo.</p>
                        </template>
                    </div>
                </div>

                <!-- TAB 3: BÁO CÁO -->
                <div x-show="activeTab === 'report'" class="space-y-3">
                    <div class="grid grid-cols-2 gap-3">
                        <div class="bg-emerald-50 border border-emerald-100 p-4 rounded-2xl">
                            <p class="text-xs text-emerald-600 font-semibold uppercase">Tổng thu nhập</p>
                            <p class="text-xl font-bold text-emerald-700 mt-1" x-text="formatMoney(calculateTotalIncome())"></p>
                        </div>
                        <div class="bg-red-50 border border-red-100 p-4 rounded-2xl">
                            <p class="text-xs text-red-600 font-semibold uppercase">Tổng chi tiêu</p>
                            <p class="text-xl font-bold text-red-700 mt-1" x-text="formatMoney(calculateTotalExpense())"></p>
                        </div>
                    </div>

                    <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 space-y-3">
                        <h3 class="font-bold text-gray-700 text-sm">Tóm Tắt Dòng Tiền</h3>
                        <div class="space-y-2 text-xs">
                            <div class="flex justify-between py-1 border-b">
                                <span class="text-gray-500">Chênh lệch Thu - Chi:</span>
                                <span class="font-bold" :class="(calculateTotalIncome() - calculateTotalExpense()) >= 0 ? 'text-emerald-600' : 'text-red-500'" x-text="formatMoney(calculateTotalIncome() - calculateTotalExpense())"></span>
                            </div>
                            <div class="flex justify-between py-1 border-b">
                                <span class="text-gray-500">Tổng số lượng giao dịch:</span>
                                <span class="font-bold text-gray-700" x-text="transactions.length"></span>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- TAB 4: LỊCH SỬ GIAO DỊCH (TỪ KHÁC) -->
                <div x-show="activeTab === 'tx_history'" class="space-y-3">
                    <div class="flex justify-between items-center bg-white p-3 rounded-2xl shadow-sm border border-gray-100">
                        <span class="text-xs font-semibold text-gray-500" x-text="transactions.length + ' giao dịch'"></span>
                    </div>

                    <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 divide-y divide-gray-100">
                        <template x-for="tx in sortedTransactions" :key="tx.id">
                            <div class="py-3 flex justify-between items-center">
                                <div class="flex items-center gap-3">
                                    <div class="w-9 h-9 rounded-xl flex items-center justify-center text-sm" :class="tx.type === 'income' ? 'bg-emerald-50 text-emerald-600' : 'bg-red-50 text-red-500'">
                                        <span x-text="getCategoryIcon(tx.category)"></span>
                                    </div>
                                    <div class="space-y-0.5">
                                        <p class="font-semibold text-gray-800 text-sm" x-text="tx.category || 'Chi khác'"></p>
                                        <p class="text-xs text-gray-400" x-text="formatDate(tx.date) + (tx.note ? ' • ' + tx.note : '') + ' • ' + getAccountName(tx.accountId)"></p>
                                    </div>
                                </div>
                                <div class="flex items-center gap-3">
                                    <span class="font-bold text-sm" :class="tx.type === 'income' ? 'text-emerald-600' : 'text-red-500'" x-text="(tx.type === 'income' ? '+' : '-') + formatMoney(tx.amount)"></span>
                                    <button @click="deleteTransaction(tx.id)" class="text-gray-300 hover:text-red-500 text-xs p-1">
                                        <i class="fa-solid fa-trash-can"></i>
                                    </button>
                                </div>
                            </div>
                        </template>
                        <template x-if="transactions.length === 0">
                            <p class="text-xs text-gray-400 text-center py-6">Chưa ghi nhận giao dịch nào.</p>
                        </template>
                    </div>
                </div>

            </div>
        </template>

    </main>

    <!-- THANH BOTTOM NAVIGATION (5 MỤC VỚI NÚT DẤU + NỔI BẬT Ở GIỮA) -->
    <template x-if="user">
        <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 z-40 pb-safe shadow-lg">
            <div class="max-w-md mx-auto grid grid-cols-5 h-16 relative">
                
                <!-- 1. Tổng quan -->
                <button @click="activeTab = 'home'" :class="activeTab === 'home' ? 'text-sky-600' : 'text-gray-400'" class="flex flex-col items-center justify-center gap-1 transition">
                    <i class="fa-solid fa-house text-lg"></i>
                    <span class="text-[10px] font-semibold">Tổng quan</span>
                </button>

                <!-- 2. Tài khoản / Ví -->
                <button @click="activeTab = 'wallet'" :class="activeTab === 'wallet' ? 'text-sky-600' : 'text-gray-400'" class="flex flex-col items-center justify-center gap-1 transition">
                    <i class="fa-solid fa-wallet text-lg"></i>
                    <span class="text-[10px] font-semibold">Tài khoản</span>
                </button>

                <!-- 3. NÚT DẤU + (TẠO MỚI GIAO DỊCH - TRỌNG TÂM) -->
                <div class="flex items-center justify-center">
                    <button @click="openTxModal('expense')" class="w-12 h-12 bg-sky-500 hover:bg-sky-600 text-white rounded-full flex items-center justify-center shadow-lg -mt-5 border-4 border-white transition transform active:scale-95">
                        <i class="fa-solid fa-plus text-xl"></i>
                    </button>
                </div>

                <!-- 4. Báo cáo -->
                <button @click="activeTab = 'report'" :class="activeTab === 'report' ? 'text-sky-600' : 'text-gray-400'" class="flex flex-col items-center justify-center gap-1 transition">
                    <i class="fa-solid fa-chart-pie text-lg"></i>
                    <span class="text-[10px] font-semibold">Báo cáo</span>
                </button>

                <!-- 5. Khác (Lịch sử giao dịch) -->
                <button @click="activeTab = 'tx_history'" :class="activeTab === 'tx_history' ? 'text-sky-600' : 'text-gray-400'" class="flex flex-col items-center justify-center gap-1 transition">
                    <i class="fa-solid fa-border-all text-lg"></i>
                    <span class="text-[10px] font-semibold">Khác</span>
                </button>

            </div>
        </nav>
    </template>

    <!-- MODAL THÊM VÍ -->
    <div x-show="showAccModal" class="fixed inset-0 bg-black/50 z-50 flex items-end justify-center p-4" x-cloak>
        <div class="bg-white w-full max-w-md rounded-3xl p-5 space-y-4">
            <h3 class="font-bold text-gray-800">Thêm Ví / Tài Khoản Mới</h3>
            <input type="text" x-model="newAcc.name" placeholder="Tên ví (VD: Tiền mặt, Vietcombank)" class="w-full border rounded-xl p-3 text-sm focus:outline-none focus:border-sky-500">
            <input type="number" x-model.number="newAcc.balance" placeholder="Số dư ban đầu" class="w-full border rounded-xl p-3 text-sm focus:outline-none focus:border-sky-500">
            <div class="flex gap-2">
                <button @click="showAccModal = false" class="w-1/2 py-3 bg-gray-100 rounded-xl text-sm font-semibold text-gray-600">Hủy</button>
                <button @click="addAccount()" class="w-1/2 py-3 bg-sky-600 rounded-xl text-sm font-semibold text-white">Lưu ví</button>
            </div>
        </div>
    </div>

    <!-- MODAL TẠO GIAO DỊCH (BẤM DẤU + ĐỂ MỞ) -->
    <div x-show="showTxModal" class="fixed inset-0 bg-black/50 z-50 flex items-end justify-center p-4" x-cloak>
        <div class="bg-white w-full max-w-md rounded-3xl p-5 space-y-4 max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center">
                <h3 class="font-bold text-gray-800">Tạo Giao Dịch Mới</h3>
                <button @click="showTxModal = false" class="text-gray-400 hover:text-gray-600">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>
            
            <div class="grid grid-cols-2 gap-2">
                <button @click="setTxType('expense')" :class="newTx.type === 'expense' ? 'bg-red-500 text-white' : 'bg-gray-100 text-gray-700'" class="py-2.5 rounded-xl font-semibold text-xs transition">Chi tiền (-)</button>
                <button @click="setTxType('income')" :class="newTx.type === 'income' ? 'bg-emerald-500 text-white' : 'bg-gray-100 text-gray-700'" class="py-2.5 rounded-xl font-semibold text-xs transition">Thu tiền (+)</button>
            </div>

            <!-- CHỌN DANH MỤC GIAO DỊCH -->
            <div>
                <label class="text-xs text-gray-500 font-medium mb-1 block">Danh mục</label>
                <select x-model="newTx.category" class="w-full border rounded-xl p-3 text-sm focus:outline-none focus:border-sky-500 bg-white">
                    <template x-for="cat in currentCategories" :key="cat.name">
                        <option :value="cat.name" x-text="cat.icon + ' ' + cat.name"></option>
                    </template>
                </select>
            </div>

            <!-- CHỌN VÍ -->
            <div>
                <label class="text-xs text-gray-500 font-medium mb-1 block">Tài khoản / Ví</label>
                <select x-model="newTx.accountId" class="w-full border rounded-xl p-3 text-sm focus:outline-none focus:border-sky-500 bg-white">
                    <template x-for="acc in accounts" :key="acc.id">
                        <option :value="acc.id" x-text="acc.name + ' (' + formatMoney(acc.balance) + ')'"></option>
                    </template>
                </select>
            </div>

            <div>
                <label class="text-xs text-gray-500 font-medium mb-1 block">Số tiền</label>
                <input type="number" x-model.number="newTx.amount" placeholder="0 ₫" class="w-full border rounded-xl p-3 text-sm font-bold text-gray-800 focus:outline-none focus:border-sky-500">
            </div>

            <div>
                <label class="text-xs text-gray-500 font-medium mb-1 block">Diễn giải / Ghi chú</label>
                <input type="text" x-model="newTx.note" placeholder="VD: Mua trà sữa, Tiền đổ xăng..." class="w-full border rounded-xl p-3 text-sm focus:outline-none focus:border-sky-500">
            </div>

            <button @click="addTransaction()" class="w-full py-3.5 bg-sky-600 rounded-xl text-sm font-bold text-white shadow-md hover:bg-sky-700 transition">
                Xác nhận Giao dịch
            </button>
        </div>
    </div>

    <!-- JAVASCRIPT LOGIC -->
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyD60xItsgAdFomunCdhypi26yyI5xrp0P0",
            authDomain: "appthuchimoi.firebaseapp.com",
            databaseURL: "https://appthuchimoi-default-rtdb.firebaseio.com",
            projectId: "appthuchimoi",
            storageBucket: "appthuchimoi.firebasestorage.app",
            messagingSenderId: "77316598744",
            appId: "1:77316598744:web:e0da4f203841cdfcee60ad",
            measurementId: "G-LDYPBV32N6"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.database();

        function app() {
            return {
                user: null,
                activeTab: 'home',
                authTab: 'google',
                emailInput: '',
                passwordInput: '',
                isLoggingIn: false,
                accounts: [],
                transactions: [],
                showAccModal: false,
                showTxModal: false,
                newAcc: { name: '', balance: 0 },
                newTx: { type: 'expense', category: 'Ăn uống', accountId: '', amount: 0, note: '' },

                expenseCategories: [
                    { name: 'Cafe/Trà sữa', icon: '☕' },
                    { name: 'Xăng xe', icon: '⛽' },
                    { name: 'Ăn uống', icon: '🍜' },
                    { name: 'Mua sắm', icon: '🛒' },
                    { name: 'Dịch vụ gia đình', icon: '🏠' },
                    { name: 'Giải trí', icon: '🎬' },
                    { name: 'Sức khỏe', icon: '💊' },
                    { name: 'Chi khác', icon: '❓' }
                ],
                incomeCategories: [
                    { name: 'Lương', icon: '💵' },
                    { name: 'Thưởng', icon: '🎁' },
                    { name: 'Bán hàng', icon: '🛍️' },
                    { name: 'Thu khác', icon: '💰' }
                ],

                get currentCategories() {
                    return this.newTx.type === 'expense' ? this.expenseCategories : this.incomeCategories;
                },

                setTxType(type) {
                    this.newTx.type = type;
                    this.newTx.category = type === 'expense' ? 'Ăn uống' : 'Lương';
                },

                getCategoryIcon(catName) {
                    const allCats = [...this.expenseCategories, ...this.incomeCategories];
                    const found = allCats.find(c => c.name === catName);
                    return found ? found.icon : '📝';
                },

                init() {
                    auth.getRedirectResult().catch(err => {
                        if (err.code && err.code !== 'auth/cancelled-popup-request') {
                            alert("Lỗi đăng nhập: " + err.message);
                        }
                    });

                    auth.onAuthStateChanged(u => {
                        this.user = u;
                        this.isLoggingIn = false;
                        if (u) {
                            this.loadData();
                        } else {
                            this.accounts = [];
                            this.transactions = [];
                        }
                    });
                },

                loginWithGoogle() {
                    if (this.isLoggingIn) return;
                    this.isLoggingIn = true;

                    const provider = new firebase.auth.GoogleAuthProvider();
                    const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);

                    if (isMobile) {
                        auth.signInWithRedirect(provider);
                    } else {
                        auth.signInWithPopup(provider)
                            .then(() => { this.isLoggingIn = false; })
                            .catch(err => {
                                this.isLoggingIn = false;
                                if (err.code !== 'auth/cancelled-popup-request' && err.code !== 'auth/popup-closed-by-user') {
                                    alert("Lỗi đăng nhập Google: " + err.message);
                                }
                            });
                    }
                },

                loginWithEmail() {
                    if (!this.emailInput || !this.passwordInput) return alert("Vui lòng nhập đầy đủ Email và Mật khẩu!");
                    auth.signInWithEmailAndPassword(this.emailInput, this.passwordInput)
                        .catch(err => alert("Lỗi đăng nhập: " + err.message));
                },

                registerWithEmail() {
                    if (!this.emailInput || !this.passwordInput) return alert("Vui lòng nhập đầy đủ Email và Mật khẩu!");
                    if (this.passwordInput.length < 6) return alert("Mật khẩu phải từ 6 ký tự trở lên!");
                    auth.createUserWithEmailAndPassword(this.emailInput, this.passwordInput)
                        .then(() => alert("Đăng ký thành công!"))
                        .catch(err => alert("Lỗi đăng ký: " + err.message));
                },

                logout() {
                    auth.signOut();
                },

                loadData() {
                    if (!this.user) return;
                    db.ref('users/' + this.user.uid).on('value', snapshot => {
                        const data = snapshot.val();
                        if (data) {
                            this.accounts = data.accounts ? Object.values(data.accounts) : [];
                            this.transactions = data.transactions ? Object.values(data.transactions) : [];
                        } else {
                            this.accounts = [];
                            this.transactions = [];
                        }
                    });
                },

                calculateTotalBalance() {
                    return this.accounts.reduce((sum, acc) => sum + Number(acc.balance || 0), 0);
                },

                calculateTotalIncome() {
                    return this.transactions.filter(t => t.type === 'income').reduce((sum, t) => sum + Number(t.amount || 0), 0);
                },

                calculateTotalExpense() {
                    return this.transactions.filter(t => t.type === 'expense').reduce((sum, t) => sum + Number(t.amount || 0), 0);
                },

                openAccountModal() {
                    this.newAcc = { name: '', balance: '' };
                    this.showAccModal = true;
                },

                addAccount() {
                    if (!this.newAcc.name) return alert("Vui lòng nhập tên ví!");
                    const id = db.ref().child('users').push().key;
                    const accountData = {
                        id: id,
                        name: this.newAcc.name,
                        balance: Number(this.newAcc.balance) || 0
                    };
                    db.ref(`users/${this.user.uid}/accounts/${id}`).set(accountData);
                    this.showAccModal = false;
                },

                deleteAccount(id) {
                    if (confirm("Bạn có chắc chắn muốn xóa ví này?")) {
                        db.ref(`users/${this.user.uid}/accounts/${id}`).remove();
                    }
                },

                openTxModal(type = 'expense') {
                    if (this.accounts.length === 0) return alert("Bạn cần tạo ít nhất 1 ví tài khoản trước!");
                    this.newTx = { 
                        type: type, 
                        category: type === 'expense' ? 'Ăn uống' : 'Lương', 
                        accountId: this.accounts[0].id, 
                        amount: '', 
                        note: '' 
                    };
                    this.showTxModal = true;
                },

                addTransaction() {
                    if (!this.newTx.amount || this.newTx.amount <= 0) return alert("Vui lòng nhập số tiền hợp lệ!");
                    
                    const id = db.ref().child('users').push().key;
                    const amount = Number(this.newTx.amount);
                    const txData = {
                        id: id,
                        type: this.newTx.type,
                        category: this.newTx.category,
                        accountId: this.newTx.accountId,
                        amount: amount,
                        note: this.newTx.note,
                        date: new Date().toISOString()
                    };

                    const targetAcc = this.accounts.find(a => a.id === this.newTx.accountId);
                    if (targetAcc) {
                        const newBalance = this.newTx.type === 'income' 
                            ? Number(targetAcc.balance) + amount 
                            : Number(targetAcc.balance) - amount;
                        
                        db.ref(`users/${this.user.uid}/accounts/${targetAcc.id}/balance`).set(newBalance);
                    }

                    db.ref(`users/${this.user.uid}/transactions/${id}`).set(txData);
                    this.showTxModal = false;
                },

                deleteTransaction(id) {
                    if (confirm("Xóa giao dịch này?")) {
                        db.ref(`users/${this.user.uid}/transactions/${id}`).remove();
                    }
                },

                get sortedTransactions() {
                    return [...this.transactions].sort((a, b) => new Date(b.date) - new Date(a.date));
                },

                getAccountName(accId) {
                    const acc = this.accounts.find(a => a.id === accId);
                    return acc ? acc.name : 'Ví không xác định';
                },

                formatMoney(amount) {
                    return new Intl.NumberFormat('vi-VN', { style: 'currency', currency: 'VND' }).format(amount || 0);
                },

                formatDate(dateStr) {
                    if (!dateStr) return '';
                    const d = new Date(dateStr);
                    return `${d.getDate()}/${d.getMonth()+1}/${d.getFullYear()}`;
                }
            }
        }
    </script>
</body>
</html>
