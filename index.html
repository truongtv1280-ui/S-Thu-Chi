<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Sổ Thu Chi MISA</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background-color: #f2f4f7; display: flex; justify-content: center; min-height: 100vh; }
    .app-container { width: 100%; max-width: 414px; background-color: #f2f5f8; display: flex; flex-direction: column; position: relative; min-height: 100vh; box-shadow: 0 0 10px rgba(0,0,0,0.1); padding-bottom: 70px; }

    /* Page View Management */
    .tab-content { display: none; }
    .tab-content.active { display: block; }

    /* Header Profile */
    .top-header { background: linear-gradient(135deg, #1d82db 0%, #106fcc 100%); padding: 16px 16px 50px 16px; color: #fff; display: flex; justify-content: space-between; align-items: center; }
    .user-info { display: flex; align-items: center; gap: 12px; }
    .avatar-circle { width: 42px; height: 42px; background-color: #1255a1; border: 2px solid #52a5f5; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 16px; color: #fff; position: relative; }
    .avatar-circle::after { content: 'G'; position: absolute; bottom: -2px; right: -2px; background: #ea4335; color: #fff; font-size: 8px; width: 12px; height: 12px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; }
    .user-text .greeting { font-size: 13px; opacity: 0.85; }
    .user-text .username { font-size: 18px; font-weight: bold; margin-top: 1px; }
    .header-icons { display: flex; gap: 14px; align-items: center; }
    .icon-btn { font-size: 18px; cursor: pointer; opacity: 0.9; }

    /* Account Header */
    .account-header { background: linear-gradient(180deg, #1890ff 0%, #096dd9 100%); padding: 20px 16px 60px 16px; color: #fff; }
    .account-title { font-size: 22px; font-weight: bold; }

    /* Balance Cards */
    .balance-card { background: #fff; margin: -35px 14px 14px 14px; padding: 18px 16px; border-radius: 12px; box-shadow: 0 3px 10px rgba(0,0,0,0.05); display: flex; justify-content: space-between; align-items: center; z-index: 2; position: relative; }
    .balance-label { font-size: 15px; color: #555; font-weight: 500; }
    .balance-value { font-size: 26px; font-weight: 800; color: #111; margin-top: 4px; display: flex; align-items: center; gap: 8px; }
    .eye-icon { font-size: 16px; color: #666; cursor: pointer; }
    .arrow-right { color: #888; font-size: 18px; font-weight: bold; }

    .asset-card { background: linear-gradient(135deg, #40a9ff 0%, #096dd9 100%); color: #fff; margin: -40px 14px 14px 14px; padding: 20px 16px; border-radius: 12px; box-shadow: 0 4px 12px rgba(24,144,255,0.3); display: flex; justify-content: space-between; align-items: center; z-index: 2; position: relative; }
    .asset-label { font-size: 15px; opacity: 0.9; }
    .asset-value { font-size: 28px; font-weight: 800; margin-top: 4px; display: flex; align-items: center; gap: 8px; }
    .asset-add-btn { width: 36px; height: 36px; background: rgba(255,255,255,0.9); color: #096dd9; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: bold; cursor: pointer; box-shadow: 0 2px 6px rgba(0,0,0,0.15); }

    /* Main Section Cards */
    .main-card { background: #fff; margin: 0 14px 14px 14px; padding: 16px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); }
    .card-title-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
    .card-title { font-size: 17px; font-weight: 700; color: #222; display: flex; align-items: center; gap: 6px; }
    .time-select { padding: 6px 10px; border-radius: 8px; border: 1px solid #dcdfe6; background: #fff; font-size: 14px; color: #333; outline: none; }

    /* Account Items */
    .acc-item { background: #fff; border: 1px solid #f0f0f0; border-radius: 10px; padding: 14px 16px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; position: relative; }
    .acc-item:last-child { margin-bottom: 0; }
    .acc-info { display: flex; align-items: center; gap: 14px; }
    .acc-icon { width: 42px; height: 42px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 22px; background: #e6f7ff; }
    .acc-name { font-size: 16px; font-weight: bold; color: #222; }
    .acc-amount { font-size: 15px; color: #666; margin-top: 2px; }
    .acc-more { color: #8c8c8c; font-size: 20px; cursor: pointer; padding: 4px 8px; }

    /* Summary Bar Chart */
    .summary-grid { display: grid; grid-template-columns: 80px 1fr; gap: 12px; margin-bottom: 20px; align-items: center; }
    .bars-container { display: flex; justify-content: center; align-items: flex-end; gap: 12px; height: 110px; padding-bottom: 4px; }
    .bar-wrapper { display: flex; flex-direction: column; align-items: center; height: 100%; justify-content: flex-end; width: 22px; }
    .bar { width: 100%; border-radius: 3px 3px 0 0; min-height: 2px; }
    .bar.green { background-color: #52c41a; }
    .bar.red { background-color: #ff4d4f; }

    .numbers-list { display: flex; flex-direction: column; gap: 10px; }
    .number-row { display: flex; justify-content: space-between; align-items: center; font-size: 15px; }
    .num-label { color: #666; }
    .num-val { font-weight: 700; font-size: 16px; }
    .val-green { color: #2e7d32; }
    .val-red { color: #d32f2f; }
    .val-dark { color: #111; }

    /* Donut Chart */
    .chart-section { display: flex; align-items: center; justify-content: space-around; padding: 10px 0; border-top: 1px solid #f0f0f0; margin-top: 10px; }
    .donut-chart-box { width: 140px; height: 140px; position: relative; }
    .donut-chart { width: 100%; height: 100%; border-radius: 50%; background: conic-gradient(#fadb14 0% 0%, #e8e8e8 0% 100%); display: flex; align-items: center; justify-content: center; }
    .donut-hole { width: 80px; height: 80px; background: #fff; border-radius: 50%; }

    .chart-legend { display: flex; flex-direction: column; gap: 8px; flex: 1; padding-left: 10px; }
    .legend-item { display: flex; align-items: center; justify-content: space-between; font-size: 14px; }
    .legend-left { display: flex; align-items: center; gap: 6px; color: #444; }
    .dot { width: 10px; height: 10px; border-radius: 2px; }
    .legend-percent { font-weight: bold; color: #111; }

    .btn-history-container { display: flex; justify-content: flex-end; margin-top: 16px; }
    .btn-history { border: 1px solid #d9d9d9; background: #fff; border-radius: 8px; padding: 8px 16px; font-size: 14px; color: #333; font-weight: 500; cursor: pointer; }

    /* Modals */
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: flex-end; z-index: 100; }
    .modal.active { display: flex; }
    .modal-content { background: #fff; width: 100%; max-width: 414px; border-radius: 16px 16px 0 0; padding: 20px; animation: slideUp 0.25s ease-out; }
    @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
    
    .form-group { margin-bottom: 14px; }
    .form-group label { display: block; font-size: 13px; color: #666; margin-bottom: 6px; font-weight: 500; }
    .form-control { width: 100%; padding: 12px; border: 1px solid #d9d9d9; border-radius: 8px; font-size: 15px; outline: none; background: #fff; }
    .submit-btn { width: 100%; padding: 14px; background: #1890ff; color: #fff; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 8px; }

    .history-list { max-height: 300px; overflow-y: auto; margin-top: 10px; }
    .history-item { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #eee; }

    /* Bottom Navigation */
    .bottom-nav { position: fixed; bottom: 0; width: 100%; max-width: 414px; height: 60px; background: #fff; display: flex; justify-content: space-around; align-items: center; border-top: 1px solid #e8e8e8; z-index: 10; }
    .nav-item { display: flex; flex-direction: column; align-items: center; font-size: 10px; color: #777; text-decoration: none; width: 20%; cursor: pointer; }
    .nav-item.active { color: #1890ff; font-weight: bold; }
    .nav-icon { font-size: 18px; margin-bottom: 2px; }
    .add-btn-wrapper { width: 20%; display: flex; justify-content: center; }
    .add-btn { width: 46px; height: 46px; background: #1890ff; color: #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 26px; margin-top: -20px; box-shadow: 0 4px 10px rgba(24,144,255,0.4); cursor: pointer; }
  </style>
</head>
<body>

  <div class="app-container">
    
    <!-- TAB 1: TỔNG QUAN -->
    <div id="tabOverview" class="tab-content active">
      <div class="top-header">
        <div class="user-info">
          <div class="avatar-circle">TT</div>
          <div class="user-text">
            <div class="greeting">Xin chào!</div>
            <div class="username">Tran Truong</div>
          </div>
        </div>
        <div class="header-icons">
          <span class="icon-btn">🔄</span>
          <span class="icon-btn">🔔</span>
        </div>
      </div>

      <div class="balance-card">
        <div>
          <div class="balance-label">Tổng số dư</div>
          <div class="balance-value">
            <span class="val-balance">0 đ</span>
            <span class="eye-icon toggleEye">👁️</span>
          </div>
        </div>
        <div class="arrow-right">›</div>
      </div>

      <div class="main-card">
        <div class="card-title-row">
          <div class="card-title">Tình hình thu chi ⚙️</div>
          <select class="time-select">
            <option>Hôm nay</option>
            <option>Tuần này</option>
            <option selected>Tháng này</option>
            <option>Quý này</option>
            <option>Năm nay</option>
          </select>
        </div>

        <div class="summary-grid">
          <div class="bars-container">
            <div class="bar-wrapper"><div class="bar green" id="barThu" style="height: 0%;"></div></div>
            <div class="bar-wrapper"><div class="bar red" id="barChi" style="height: 100%;"></div></div>
          </div>
          <div class="numbers-list">
            <div class="number-row"><span class="num-label">Thu</span><span class="num-val val-green" id="textThu">0 đ</span></div>
            <div class="number-row"><span class="num-label">Chi</span><span class="num-val val-red" id="textChi">0 đ</span></div>
            <div class="number-row"><span class="num-label">Chênh lệch</span><span class="num-val val-dark" id="textDiff">0 đ</span></div>
          </div>
        </div>

        <div class="chart-section">
          <div class="donut-chart-box">
            <div class="donut-chart" id="donutChart"><div class="donut-hole"></div></div>
          </div>
          <div class="chart-legend" id="chartLegend"></div>
        </div>

        <div class="btn-history-container">
          <button class="btn-history" id="openHistoryBtn">Lịch sử ghi chép</button>
        </div>
      </div>

      <div class="main-card">
        <div class="card-title-row">
          <div class="card-title">Phân tích chi tiêu...</div>
          <select class="time-select"><option>01/2026 - 12/2026</option></select>
        </div>
      </div>
    </div>

    <!-- TAB 2: TÀI KHOẢN -->
    <div id="tabAccount" class="tab-content">
      <div class="account-header">
        <div class="account-title">Tài khoản của tôi</div>
      </div>

      <div class="asset-card">
        <div>
          <div class="asset-label">Tổng tài sản</div>
          <div class="asset-value">
            <span class="val-balance">0 đ</span>
            <span class="eye-icon toggleEye" style="color:rgba(255,255,255,0.8);">👁️</span>
          </div>
        </div>
        <div class="asset-add-btn" id="openAddAccountBtn">+</div>
      </div>

      <!-- Danh sách tài khoản -->
      <div class="main-card">
        <div class="card-title-row">
          <div class="card-title" id="accCountTitle">Tài khoản chi tiêu (0)</div>
          <div class="arrow-right">›</div>
        </div>
        <div id="accountList"></div>
      </div>
    </div>

    <!-- Navigation Bar -->
    <div class="bottom-nav">
      <div class="nav-item active" onclick="switchTab('tabOverview', this)">
        <span class="nav-icon">🏠</span>
        <span>Tổng quan</span>
      </div>
      <div class="nav-item" onclick="switchTab('tabAccount', this)">
        <span class="nav-icon">👛</span>
        <span>Tài khoản</span>
      </div>
      <div class="add-btn-wrapper">
        <div class="add-btn" id="openAddModal">+</div>
      </div>
      <div class="nav-item">
        <span class="nav-icon">📊</span>
        <span>Báo cáo</span>
      </div>
      <div class="nav-item">
        <span class="nav-icon">⊞</span>
        <span>Khác</span>
      </div>
    </div>

  </div>

  <!-- Modal Thêm/Sửa Tài Khoản -->
  <div class="modal" id="accountModal">
    <div class="modal-content">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
        <h3 style="font-size:16px;" id="accModalTitle">Thêm tài khoản</h3>
        <span id="closeAccountModal" style="font-size:22px; cursor:pointer;">✕</span>
      </div>

      <div class="form-group">
        <label>Tên tài khoản / Ví</label>
        <input type="text" id="inputAccName" class="form-control" placeholder="Ví dụ: Tiền Mặt, VCB, Momo...">
      </div>

      <div class="form-group">
        <label>Số tiền hiện tại (VNĐ)</label>
        <input type="number" id="inputAccBalance" class="form-control" placeholder="0" pattern="[0-9]*">
      </div>

      <div class="form-group">
        <label>Biểu tượng</label>
        <select id="inputAccIcon" class="form-control">
          <option value="💵">💵 Tiền mặt</option>
          <option value="🏦">🏦 Ngân hàng</option>
          <option value="💳">💳 Thẻ tín dụng</option>
          <option value="📱">📱 Ví điện tử</option>
        </select>
      </div>

      <button class="submit-btn" id="saveAccountBtn">Lưu tài khoản</button>
    </div>
  </div>

  <!-- Modal Thêm Giao Dịch Chuẩn Theo Hình -->
  <div class="modal" id="addModal">
    <div class="modal-content">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
        <h3 style="font-size:17px; font-weight:bold;">Ghi chép giao dịch</h3>
        <span id="closeAddModal" style="font-size:22px; cursor:pointer;">✕</span>
      </div>

      <!-- Loại Giao Dịch Dropdown -->
      <div class="form-group">
        <label>Loại giao dịch</label>
        <select id="txTypeSelect" class="form-control" style="font-weight:bold; color:#1890ff;">
          <option value="CHI">⛔ Chi tiền</option>
          <option value="THU">➕ Thu tiền</option>
          <option value="CHO_VAY">💸 Cho vay</option>
          <option value="DI_VAY">💰 Đi vay</option>
          <option value="CHUYEN_KHOAN">🔄 Chuyển khoản</option>
          <option value="DIEU_CHINH">📝 Điều chỉnh số dư</option>
        </select>
      </div>

      <div class="form-group">
        <label>Số tiền (VNĐ)</label>
        <input type="number" id="inputAmount" class="form-control" placeholder="0" pattern="[0-9]*" style="font-size:18px; font-weight:bold;">
      </div>

      <!-- Chọn Nguồn / Ví -->
      <div class="form-group" id="fromAccGroup">
        <label id="fromAccLabel">Từ tài khoản / Nguồn tiền</label>
        <select id="inputAccSelect" class="form-control"></select>
      </div>

      <!-- Chọn Ví Nhận (Khi Chuyển Khoản) -->
      <div class="form-group" id="toAccGroup" style="display:none;">
        <label>Đến tài khoản / Ví nhận</label>
        <select id="inputToAccSelect" class="form-control"></select>
      </div>

      <div class="form-group" id="categoryGroup">
        <label>Hạng mục</label>
        <select id="inputCategory" class="form-control">
          <option value="Đi lại">⛽ Đi lại / Xăng xe</option>
          <option value="Ăn uống">☕ Ăn uống</option>
          <option value="Con cái">👶 Con cái</option>
          <option value="Lương">💰 Lương / Thu nhập</option>
          <option value="Khác">🛍️ Khác</option>
        </select>
      </div>

      <div class="form-group">
        <label>Diễn giải / Ghi chú</label>
        <input type="text" id="inputNote" class="form-control" placeholder="Nhập ghi chú...">
      </div>

      <button class="submit-btn" id="saveBtn">Lưu giao dịch ✔</button>
    </div>
  </div>

  <!-- Modal Lịch Sử -->
  <div class="modal" id="historyModal">
    <div class="modal-content">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
        <h3 style="font-size:16px;">Lịch sử ghi chép</h3>
        <span id="closeHistoryModal" style="font-size:22px; cursor:pointer;">✕</span>
      </div>
      <div class="history-list" id="historyList"></div>
    </div>
  </div>

  <script>
    const categoryColors = { 'Đi lại': '#fadb14', 'Ăn uống': '#ff4d4f', 'Con cái': '#1890ff', 'Lương': '#52c41a', 'Khác': '#722ed1' };
    let isHide = false;

    // Danh sách Tài Khoản
    let accounts = JSON.parse(localStorage.getItem('misa_app_accounts')) || [
      { id: 1, name: 'Tiền Mặt', balance: 500000, icon: '💵' },
      { id: 2, name: 'VCB', balance: 945000, icon: '🏦' }
    ];

    // Lịch sử giao dịch
    let transactions = JSON.parse(localStorage.getItem('misa_app_txs')) || [
      { id: 1, type: 'CHI', amount: 50000, category: 'Đi lại', note: 'Xăng xe', accId: 2 },
      { id: 2, type: 'CHI', amount: 5000, category: 'Ăn uống', note: 'Cà phê', accId: 1 }
    ];

    const formatVND = (num) => new Intl.NumberFormat('vi-VN').format(num) + ' đ';

    function switchTab(tabId, element) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
      document.getElementById(tabId).classList.add('active');
      if(element) element.classList.add('active');
    }

    function updateUI() {
      const totalAssets = accounts.reduce((sum, acc) => sum + acc.balance, 0);

      document.querySelectorAll('.val-balance').forEach(el => {
        el.innerText = isHide ? '•••••••• đ' : formatVND(totalAssets);
      });

      // Render danh sách tài khoản
      document.getElementById('accCountTitle').innerText = `Tài khoản chi tiêu (${accounts.length})`;
      const accListEl = document.getElementById('accountList');
      accListEl.innerHTML = '';

      const accSelectEl = document.getElementById('inputAccSelect');
      const toAccSelectEl = document.getElementById('inputToAccSelect');
      accSelectEl.innerHTML = '';
      toAccSelectEl.innerHTML = '';

      accounts.forEach(acc => {
        const item = document.createElement('div');
        item.className = 'acc-item';
        item.innerHTML = `
          <div class="acc-info">
            <div class="acc-icon">${acc.icon}</div>
            <div>
              <div class="acc-name">${acc.name}</div>
              <div class="acc-amount">${isHide ? '•••••••• đ' : formatVND(acc.balance)}</div>
            </div>
          </div>
          <div class="acc-more" onclick="deleteAccount(${acc.id})">🗑️</div>
        `;
        accListEl.appendChild(item);

        const opt = document.createElement('option');
        opt.value = acc.id;
        opt.innerText = `${acc.icon} ${acc.name} (${formatVND(acc.balance)})`;
        
        accSelectEl.appendChild(opt);
        toAccSelectEl.appendChild(opt.cloneNode(true));
      });

      // Báo cáo Thu Chi
      let totalThu = 0;
      let totalChi = 0;
      let expByCat = {};

      transactions.forEach(t => {
        if (t.type === 'THU' || t.type === 'DI_VAY') {
          totalThu += t.amount;
        } else if (t.type === 'CHI' || t.type === 'CHO_VAY') {
          totalChi += t.amount;
          if (t.category) expByCat[t.category] = (expByCat[t.category] || 0) + t.amount;
        }
      });

      const diff = totalThu - totalChi;
      document.getElementById('textThu').innerText = formatVND(totalThu);
      document.getElementById('textChi').innerText = formatVND(totalChi);
      
      const diffEl = document.getElementById('textDiff');
      diffEl.innerText = (diff > 0 ? '+' : '') + formatVND(diff);
      diffEl.style.color = diff < 0 ? '#ff4d4f' : '#2e7d32';

      const maxVal = Math.max(totalThu, totalChi, 1);
      document.getElementById('barThu').style.height = `${(totalThu / maxVal) * 100}%`;
      document.getElementById('barChi').style.height = `${(totalChi / maxVal) * 100}%`;

      // Donut Chart
      const legendEl = document.getElementById('chartLegend');
      legendEl.innerHTML = '';
      
      if (totalChi === 0) {
        document.getElementById('donutChart').style.background = '#e8e8e8';
        legendEl.innerHTML = '<div style="color:#888; font-size:13px;">Chưa có chi tiêu</div>';
      } else {
        let gradientStops = [];
        let currentDeg = 0;

        for (const [cat, val] of Object.entries(expByCat)) {
          const percent = (val / totalChi) * 100;
          const deg = (percent / 100) * 360;
          const color = categoryColors[cat] || '#722ed1';

          gradientStops.push(`${color} ${currentDeg}deg ${currentDeg + deg}deg`);
          currentDeg += deg;

          const item = document.createElement('div');
          item.className = 'legend-item';
          item.innerHTML = `
            <div class="legend-left"><span class="dot" style="background:${color}"></span><span>${cat}</span></div>
            <span class="legend-percent">${percent.toFixed(2).replace('.', ',')}%</span>
          `;
          legendEl.appendChild(item);
        }

        document.getElementById('donutChart').style.background = `conic-gradient(${gradientStops.join(', ')})`;
      }

      localStorage.setItem('misa_app_accounts', JSON.stringify(accounts));
      localStorage.setItem('misa_app_txs', JSON.stringify(transactions));
    }

    // Dynamic UI Form theo Loại Giao Dịch
    const txTypeSelect = document.getElementById('txTypeSelect');
    const toAccGroup = document.getElementById('toAccGroup');
    const categoryGroup = document.getElementById('categoryGroup');
    const fromAccLabel = document.getElementById('fromAccLabel');

    txTypeSelect.onchange = () => {
      const type = txTypeSelect.value;
      if (type === 'CHUYEN_KHOAN') {
        toAccGroup.style.display = 'block';
        categoryGroup.style.display = 'none';
        fromAccLabel.innerText = 'Từ tài khoản';
      } else if (type === 'DIEU_CHINH') {
        toAccGroup.style.display = 'none';
        categoryGroup.style.display = 'none';
        fromAccLabel.innerText = 'Tài khoản điều chỉnh';
      } else {
        toAccGroup.style.display = 'none';
        categoryGroup.style.display = 'block';
        fromAccLabel.innerText = 'Từ tài khoản / Nguồn tiền';
      }
    };

    // Toggle Eye Hide/Show
    document.querySelectorAll('.toggleEye').forEach(el => {
      el.onclick = () => { isHide = !isHide; updateUI(); };
    });

    // Account Modal Controls
    const accountModal = document.getElementById('accountModal');
    document.getElementById('openAddAccountBtn').onclick = () => {
      document.getElementById('accModalTitle').innerText = 'Thêm tài khoản';
      document.getElementById('inputAccName').value = '';
      document.getElementById('inputAccBalance').value = '';
      accountModal.classList.add('active');
    };
    document.getElementById('closeAccountModal').onclick = () => accountModal.classList.remove('active');

    document.getElementById('saveAccountBtn').onclick = () => {
      const name = document.getElementById('inputAccName').value.trim();
      const balance = parseFloat(document.getElementById('inputAccBalance').value) || 0;
      const icon = document.getElementById('inputAccIcon').value;

      if (!name) { alert('Vui lòng nhập tên tài khoản!'); return; }

      accounts.push({ id: Date.now(), name, balance, icon });
      updateUI();
      accountModal.classList.remove('active');
    };

    function deleteAccount(id) {
      if (confirm('Bạn có chắc chắn muốn xóa tài khoản này không?')) {
        accounts = accounts.filter(a => a.id !== id);
        updateUI();
      }
    }

    // Add Transaction Modal
    const addModal = document.getElementById('addModal');
    document.getElementById('openAddModal').onclick = () => {
      if (accounts.length === 0) { alert('Vui lòng tạo ít nhất 1 tài khoản trước!'); return; }
      addModal.classList.add('active');
    };
    document.getElementById('closeAddModal').onclick = () => addModal.classList.remove('active');

    // History Modal
    const historyModal = document.getElementById('historyModal');
    document.getElementById('openHistoryBtn').onclick = () => {
      const listEl = document.getElementById('historyList');
      listEl.innerHTML = '';
      transactions.forEach(t => {
        const acc = accounts.find(a => a.id === t.accId);
        const div = document.createElement('div');
        div.className = 'history-item';
        div.innerHTML = `
          <div>
            <div style="font-weight:bold;">[${t.type}] ${t.category || ''} ${acc ? '• ' + acc.name : ''}</div>
            <div style="font-size:12px; color:#888;">${t.note || 'Không có ghi chú'}</div>
          </div>
          <div style="font-weight:bold; color:${['THU','DI_VAY'].includes(t.type)?'#2e7d32':'#ff4d4f'};">
            ${formatVND(t.amount)}
          </div>
        `;
        listEl.appendChild(div);
      });
      historyModal.classList.add('active');
    };
    document.getElementById('closeHistoryModal').onclick = () => historyModal.classList.remove('active');

    // Save Transaction Logic
    document.getElementById('saveBtn').onclick = () => {
      const type = txTypeSelect.value;
      const amt = parseFloat(document.getElementById('inputAmount').value);
      const cat = document.getElementById('inputCategory').value;
      const note = document.getElementById('inputNote').value;
      const fromAccId = parseInt(document.getElementById('inputAccSelect').value);
      const toAccId = parseInt(document.getElementById('inputToAccSelect').value);

      if (isNaN(amt) || amt <= 0) { alert('Vui lòng nhập số tiền hợp lệ!'); return; }

      const fromAcc = accounts.find(a => a.id === fromAccId);

      if (type === 'CHI' || type === 'CHO_VAY') {
        if (fromAcc) fromAcc.balance -= amt;
      } else if (type === 'THU' || type === 'DI_VAY') {
        if (fromAcc) fromAcc.balance += amt;
      } else if (type === 'CHUYEN_KHOAN') {
        if (fromAccId === toAccId) { alert('Tài khoản nhận phải khác tài khoản chuyển!'); return; }
        const toAcc = accounts.find(a => a.id === toAccId);
        if (fromAcc) fromAcc.balance -= amt;
        if (toAcc) toAcc.balance += amt;
      } else if (type === 'DIEU_CHINH') {
        if (fromAcc) fromAcc.balance = amt;
      }

      transactions.unshift({ id: Date.now(), type, amount: amt, category: (type==='CHUYEN_KHOAN'?'Chuyển khoản':cat), note, accId: fromAccId });
      updateUI();

      document.getElementById('inputAmount').value = '';
      document.getElementById('inputNote').value = '';
      addModal.classList.remove('active');
    };

    updateUI();
  </script>
</body>
</html>
